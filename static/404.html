<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Permafy - 404</title>
        <style>
            :root {
                --page-bg: #333333;
                --panel-bg: #333333;
                --panel-border: rgba(255, 255, 255, 0.08);
                --text: #ffffff;
                --muted: #dfe8ff;
                --accent: #4067ff;
                --accent-2: #2f54e5;
            }
            * { box-sizing: border-box; }
            html, body {
                margin: 0;
                min-height: 100%;
                height: 100%;
                font-family: Arial, Helvetica, sans-serif;
                background: var(--page-bg);
                color: var(--text);
            }
            body {
                display: grid;
                place-items: center;
            }
            .card {
                width: min(92vw, 620px);
                padding: 36px 30px 28px;
                background: var(--panel-bg);
                border: 1px solid var(--panel-border);
                border-radius: 0;
                box-shadow: none;
                text-align: center;
            }
            .title-row {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 18px;
                margin-bottom: 6px;
            }
            .what-icon {
                width: 64px;
                height: 64px;
                display: block;
                filter: drop-shadow(0 0 18px rgba(64, 103, 255, 0.25));
            }
            .code {
                margin: 0;
                font-size: clamp(3.4rem, 10vw, 6rem);
                line-height: 1;
                font-weight: 800;
                letter-spacing: -0.08em;
                color: var(--text);
            }
            h1 {
                margin: 8px 0 10px;
                font-size: clamp(1.8rem, 4vw, 2.6rem);
                font-weight: 700;
                letter-spacing: -0.04em;
                line-height: 1.15;
            }
            p {
                margin: 0 auto 24px;
                max-width: 520px;
                color: var(--muted);
                line-height: 1.6;
                font-size: 1.02rem;
            }
            .actions {
                display: flex;
                justify-content: center;
                gap: 12px;
                flex-wrap: wrap;
            }
            .button {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-height: 42px;
                padding: 0 18px;
                border-radius: 0;
                background: #ffffff;
                border: 1px solid rgba(255, 255, 255, 0.08);
                color: #333333;
                text-decoration: none;
                font-weight: 700;
                box-shadow: none;
                transition: background 0.15s ease, transform 0.14s ease, opacity 0.14s ease;
            }
            .button:hover {
                background: #f2f2f2;
                transform: translateY(-1px);
                opacity: 0.97;
            }
            .button.secondary {
                background: transparent;
                border-color: var(--panel-border);
                color: var(--text);
            }
            .redirect-note {
                margin-top: 14px;
                color: rgba(255, 255, 255, 0.7);
                font-size: 0.85rem;
            }
            @media (max-width: 480px) {
                .card {
                    padding: 26px 18px 22px;
                }
                .title-row {
                    gap: 10px;
                }
                .what-icon {
                    width: 46px;
                    height: 46px;
                }
                .actions {
                    flex-direction: column;
                }
                .button {
                    width: 100%;
                }
            }
        </style>
    </head>
    <body>
        <main class="card" aria-live="polite">
            <div class="title-row">
                <img class="what-icon" src="/what.svg" alt="warning icon" />
                <div class="code">404 :(</div>
            </div>
            <h1>that page doesn’t exist.</h1>
            <p>teh url you opened isn’t recognized by Permafy, it may have moved, or you probably are typing random things cuz ur bored or something. head back home and keep creating!</p>
            <div class="actions">
                <a class="button" href="https://permafy.github.io/">Go home</a>
                <a class="button secondary" href="javascript:history.back()">Go back</a>
            </div>
            <div id="countdown" class="redirect-note">redirecting to home in 5 seconds...</div>
        </main>
        <script>
            const countdown = document.getElementById('countdown');
            const totalSeconds = 5;
            let remainingSeconds = totalSeconds;

            countdown.textContent = `Redirecting to home in ${remainingSeconds} seconds...`;

            const interval = setInterval(() => {
                remainingSeconds -= 1;
                if (remainingSeconds <= 0) {
                    clearInterval(interval);
                    countdown.textContent = 'Redirecting to home...';
                    window.location.href = 'https://permafy.github.io/';
                    return;
                }
                countdown.textContent = `Redirecting to home in ${remainingSeconds} seconds...`;
            }, 1000);
        </script>
    </body>
</html>
